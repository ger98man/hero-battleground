# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hero-battleground
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start   # applies pending migrations, then starts the server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hero-battleground-db
          property: connectionString

databases:
  - name: hero-battleground-db
    plan: free
    databaseName: hero_battleground
    user: hero_battleground
