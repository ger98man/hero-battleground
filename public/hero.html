<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero Battleground — герой</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <span class="muted">Онлайн: <button class="link" id="online-count" title="Кто онлайн">…</button></span>
</header>
<div id="online-list" class="online-list hidden"></div>
<div class="layout">
<main>
  <div class="row">
    <h1 id="hero-name">…</h1>
    <button class="link" id="logout">Выйти</button>
  </div>
  <div class="card">
    <div class="row">
      <b id="level"></b>
      <span class="muted" id="xp-text"></span>
    </div>
    <div class="xp"><div id="xp-bar" style="width:0"></div></div>
    <div class="stats">
      <div class="stat"><span>Здоровье</span><b id="health"></b></div>
      <div class="stat"><span>Атака</span><b id="attack"></b></div>
      <div class="stat"><span>Защита</span><b id="defense"></b></div>
      <div class="stat"><span>Скорость</span><b id="speed"></b></div>
      <div class="stat"><span>Победы</span><b id="wins"></b></div>
      <div class="stat"><span>Поражения</span><b id="losses"></b></div>
    </div>
    <p class="muted" id="owner"></p>
    <button type="button" disabled style="width:100%">В бой (скоро: 1×1, 2×2, 3×3)</button>
  </div>
</main>
<aside class="card chat" id="chat">
  <div class="row"><b>Общий чат</b><span class="muted" id="chat-status"></span></div>
  <ol id="chat-log" class="chat-log"></ol>
  <form id="chat-form" class="chat-form">
    <input id="chat-input" maxlength="200" autocomplete="off" placeholder="Сообщение">
    <button type="submit">➤</button>
  </form>
  <div class="error" id="chat-error"></div>
</aside>
</div>
<script src="/hero.js"></script>
<script src="/chat.js"></script>
</body>
</html>
