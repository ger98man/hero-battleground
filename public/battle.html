<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero Battleground — бой</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/social.css">
</head>
<body class="battle-page" data-chat-start="collapsed">
<div class="battle">
  <header class="battle-top">
    <div class="unit-panel" id="panel-player"></div>
    <div class="center-col"><div class="round" id="round"></div><span id="topbar-online"></span></div>
    <div class="unit-panel right" id="panel-bot"></div>
  </header>

  <div class="battle-mid">
    <div class="board"><div class="grid" id="grid"></div></div>
    <aside class="panel log-box">
      <h2 class="panel-title">Журнал боя</h2>
      <div class="log" id="log"></div>
    </aside>
  </div>

  <footer class="battle-bottom">
    <div class="panel artifact-mini" id="artifact-mini"></div>
    <div class="panel action-panel">
      <div class="economy" id="economy"></div>
      <div class="skillbar" id="skillbar"></div>
      <div class="muted hint" id="hint"></div>
      <div class="error" id="error"></div>
    </div>
    <div class="end-col">
      <button type="button" id="end-turn" class="btn-end-turn"><span class="hourglass">⌛</span>Конец хода</button>
      <button type="button" class="link" id="surrender">Сдаться</button>
    </div>
  </footer>
  <section class="chat-slot" id="chat-slot"></section>
</div>

<div class="modal hidden" id="result">
  <div class="modal-box result-box">
    <h2 class="panel-title" id="result-title"></h2>
    <div id="result-body"></div>
    <div class="row gap">
      <button type="button" id="again" class="btn-primary">Ещё бой</button>
      <button type="button" class="link" id="to-hero">На главную</button>
    </div>
  </div>
</div>
<script src="/battle.js"></script>
<script src="/online.js"></script>
<script src="/chat.js"></script>
</body>
</html>
