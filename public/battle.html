<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero Battleground — бой</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/social.css">
  <link rel="stylesheet" href="/battle.css">
</head>
<body class="battle-page" data-chat="battle">
<div class="bf">
  <header class="bf-top">
    <div class="side-card" id="panel-player"></div>
    <div class="bf-center">
      <div class="queue" id="queue" title="Очередь ходов по инициативе"></div>
      <div class="round" id="round"></div>
    </div>
    <div class="side-card right" id="panel-bot"></div>
  </header>

  <div class="bf-mid">
    <div class="board" id="board"><div class="grid-wrap" id="grid-wrap"><div class="grid" id="grid"></div><div class="fx" id="fx"></div></div></div>
    <aside class="bf-side" id="bf-side">
      <div class="side-tabs">
        <button type="button" data-pane="log" class="active">Журнал</button>
        <button type="button" data-pane="chat">Боевой чат</button>
      </div>
      <div class="side-pane log" id="log"></div>
      <div class="side-pane chat-pane hidden" id="chat-slot"></div>
    </aside>
  </div>

  <footer class="bf-bottom">
    <div class="actor-card" id="actor-card"></div>
    <div class="action-panel">
      <div class="economy" id="economy"></div>
      <div class="skillbar" id="skillbar"></div>
      <div class="hint-row"><span class="hint" id="hint"></span><span class="error" id="error"></span></div>
    </div>
    <div class="end-col">
      <button type="button" id="end-turn" class="btn-end-turn"><span class="hourglass">⌛</span>Конец хода</button>
      <div class="end-row">
        <button type="button" class="small-btn" id="auto" aria-pressed="false" title="ИИ ходит за вашего героя и отряды, пока не выключите">⚙ Авто бой</button>
        <button type="button" class="small-btn" id="speed" title="Скорость анимаций боя">▶ 1×</button>
        <button type="button" class="small-btn" id="side-toggle" title="Журнал и боевой чат">📜</button>
        <button type="button" class="small-btn" id="surrender" title="Сдаться">🏳</button>
      </div>
    </div>
  </footer>
</div>

<div class="modal hidden" id="result">
  <div class="modal-box result-box">
    <h2 class="panel-title" id="result-title"></h2>
    <div id="result-body"></div>
    <div class="row gap">
      <button type="button" id="again" class="btn-primary">Ещё бой</button>
      <button type="button" class="link" id="to-hero">На главную</button>
    </div>
  </div>
</div>
<script src="/models.js"></script>
<script src="/battle.js"></script>
<script src="/chat.js"></script>
</body>
</html>
