<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero Battleground — профиль героя</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/social.css">
</head>
<body>
<main>
  <div class="row">
    <h1 id="hero-name">…</h1>
    <a class="link" href="/hero">← Мой герой</a>
  </div>
  <div class="card" id="card">
    <b id="level"></b>
    <div class="stats">
      <div class="stat"><span>Здоровье</span><b id="health"></b></div>
      <div class="stat"><span>Атака</span><b id="attack"></b></div>
      <div class="stat"><span>Защита</span><b id="defense"></b></div>
      <div class="stat"><span>Скорость</span><b id="speed"></b></div>
      <div class="stat"><span>PvP: победы / поражения</span><b id="pvp"></b></div>
      <div class="stat"><span>Бот: победы / поражения</span><b id="bot"></b></div>
    </div>
  </div>
  <p class="error" id="error"></p>
</main>
<script src="/profile.js"></script>
<script src="/online.js"></script>
<script src="/chat.js"></script>
</body>
</html>
