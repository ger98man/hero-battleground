<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero Battleground — вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/social.css">
</head>
<body class="login-page">
<main class="login">
  <div class="logo">
    <span class="logo-crest">⚜</span>
    <h1><span>Hero</span><small>Battleground</small></h1>
    <p class="tagline">Пошаговые бои героев 1×1, 2×2 и 3×3</p>
  </div>
  <div class="panel">
    <div class="tabs">
      <button type="button" id="tab-login" class="active">Вход</button>
      <button type="button" id="tab-register">Регистрация</button>
    </div>
    <form id="form">
      <label for="username">Логин</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div id="hero-field" class="hidden">
        <label for="heroName">Имя героя</label>
        <input id="heroName" name="heroName">
      </div>
      <button type="submit" id="submit" class="btn-primary">Войти</button>
      <div class="error" id="error"></div>
    </form>
  </div>
  <p class="footer-links"><a href="/wiki">Об игре</a> · <a href="/wiki/changelog">Изменения</a></p>
</main>
<script src="/login.js"></script>
<script src="/online.js"></script>
</body>
</html>
